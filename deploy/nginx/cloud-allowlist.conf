# 云端 nginx：L4 白名单（第一道，硬拦截）
#
# 客户端直连云端，所以这里看到的 $remote_addr 就是手机的真实公网 IP：
#   - 手机连矿内 WiFi：出口是矿内固定公网 IP → 放行
#   - 手机用 4G：出口是运营商 NAT → 拒绝，连 TLS 握手都建立不起来
#
# 需要 nginx 的 ngx_stream_access_module（主流发行版默认包含）。

stream {
    map $ssl_preread_server_name $rag_backend {
        rag.example.com   127.0.0.1:7100;
        default           close;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;

        # ==== 换成矿内出口 IP / 网段 ====
        allow 203.0.113.0/24;
        deny  all;

        proxy_pass $rag_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
