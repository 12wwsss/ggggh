# 矿内 nginx：TLS 终结 + 来源 IP 白名单（L7）
#
# 前置条件：
#   1. frpc 的 proxy 开启 proxyProtocolVersion = "v2"（见 deploy/frp/frpc.toml）；
#   2. 否则 $remote_addr 永远是 127.0.0.1，白名单会把所有人当成矿内。
#
# 把下面 allow 的网段换成矿内出口公网 IP（或矿内网段），deny all 保持不动。

server {
    # proxy_protocol 必须加，否则拿不到真实客户端 IP
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name rag.example.com;

    ssl_certificate     /etc/coalrag/tls/fullchain.pem;
    ssl_certificate_key /etc/coalrag/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:rag_tls:10m;

    # frp 从本机 127.0.0.1 连进来，按 PROXY protocol 还原真实 IP
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    client_max_body_size 64m;

    # ==== 白名单：换成矿方给的出口 IP / 网段 ====
    allow 203.0.113.0/24;      # 示例：矿内 WiFi 的公网出口
    allow 10.20.0.0/16;        # 示例：矿内直连（如果矿内 DNS 解析到内网地址）
    deny  all;

    # 被拒绝时的友好页面（浏览器打开时看到）
    error_page 403 /__blocked.html;
    location = /__blocked.html {
        internal;
        default_type text/html;
        return 403 '<!doctype html><meta charset="utf-8"><title>需要矿内网络</title>
<body style="font:16px/1.8 system-ui;background:#f2ece0;color:#1d1a15;padding:40px">
<h2>请先连接矿内网络</h2>
<p>本系统只允许在矿区网络内访问。请连接矿内 WiFi 或矿区专网后重试。</p>
<p style="color:#7d7466">如果已连接矿内网络仍看到此页，请联系信息科（当前来源 IP 不在允许清单内）。</p>
</body>';
    }

    # 接口被拒绝时返回 JSON，方便前端提示
    location /api/ {
        error_page 403 = @api_denied;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location @api_denied {
        default_type application/json;
        return 403 '{"code":403,"message":"请连接矿内网络（WiFi）后重试"}';
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
