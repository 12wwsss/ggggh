# 矿内 nginx：TLS 在这里终结，证书私钥不出矿。
# 监听 8443（本机回环），由 frpc 映射到云端 7100。

server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name rag.example.com;

    ssl_certificate     /etc/coalrag/tls/fullchain.pem;
    ssl_certificate_key /etc/coalrag/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:rag_tls:10m;

    # 小程序 uploadFile/downloadFile 会带较大附件
    client_max_body_size 64m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
