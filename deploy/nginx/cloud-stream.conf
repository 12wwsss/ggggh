# 云端 nginx：四层转发，不做 TLS 终结。
# 用 ssl_preread 读到 SNI 后按域名把 TCP 原样转给 frps，
# 证书私钥只在矿内，云端看不到请求正文。

stream {
    map $ssl_preread_server_name $rag_backend {
        rag.example.com   127.0.0.1:7100;   # frps 映射出来的端口
        default           close;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $rag_backend;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
