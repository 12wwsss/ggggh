<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>员工端大字版 · 首屏样张</title>
<style>
  :root {
    --paper: #f2ece0;
    --paper-2: #fffdf8;
    --ink: #1d1a15;
    --ink-2: #4a4237;
    --seal: #a5311f;
    --rule: #d9d0bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #6f6a60;
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    gap: 40px;
    padding: 40px;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    height: 844px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status {
    display: flex; justify-content: space-between;
    padding: 14px 20px 6px;
    font-size: 16px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .head { padding: 8px 20px 16px; border-bottom: 2px solid var(--rule); }
  .head .name { font-family: "Noto Serif SC", "SimSun", serif; font-size: 32px; font-weight: 700; letter-spacing: 1px; }
  .head .meta { font-size: 19px; color: var(--ink-2); margin-top: 4px; }

  .body { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; overflow: hidden; }

  .btn {
    width: 100%;
    height: 64px;
    border: 2px solid var(--ink);
    background: var(--paper-2);
    color: var(--ink);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn.primary { background: var(--seal); border-color: var(--seal); color: #fbf6ec; }
  .btn .sub { font-size: 17px; font-weight: 400; margin-left: 10px; opacity: .85; }
  .btn-row { display: flex; gap: 14px; }
  .btn-row .btn { height: 56px; font-size: 22px; }

  .todo {
    border: 2px solid var(--ink);
    background: var(--paper-2);
    padding: 18px;
  }
  .todo .tag {
    display: inline-block; font-size: 16px; letter-spacing: 2px;
    color: var(--seal); border: 2px solid var(--seal); padding: 2px 8px;
    margin-bottom: 10px;
  }
  .todo .t { font-size: 24px; font-weight: 700; line-height: 1.5; }
  .todo .d { font-size: 19px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }

  .hint { font-size: 17px; color: var(--ink-2); text-align: center; }
  .sec { font-size: 18px; color: var(--ink-2); letter-spacing: 1px; margin-bottom: 10px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .tabbar {
    border-top: 2px solid var(--ink);
    display: flex;
    height: 84px;
    background: var(--paper-2);
  }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 19px; color: var(--ink-2); }
  .tab .ico { font-size: 26px; line-height: 1; }
  .tab.active { color: var(--seal); font-weight: 700; }

  /* 问答页 */
  .ask-head { display: flex; align-items: center; gap: 12px; padding: 10px 20px 16px; border-bottom: 2px solid var(--rule); }
  .back { font-size: 24px; font-weight: 700; margin-right: 14px; }
  .ask-head .title { font-size: 26px; font-weight: 700; }

  .q {
    background: #e7ddc9;
    border: 2px solid var(--rule);
    padding: 16px 18px;
    font-size: 22px;
    line-height: 1.6;
    border-radius: 4px;
  }
  .a { border: 2px solid var(--ink); background: var(--paper-2); padding: 18px; }
  .clause {
    display: inline-block;
    background: var(--seal); color: #fbf6ec;
    font-family: "Noto Serif SC", "SimSun", serif;
    font-size: 28px; font-weight: 700; letter-spacing: 2px;
    padding: 6px 12px; border-radius: 4px;
  }
  .a .text { font-size: 22px; line-height: 1.85; margin-top: 14px; }
  .a .src { font-size: 18px; color: var(--ink-2); margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--rule); line-height: 1.6; }
  .a .acts { display: flex; gap: 12px; margin-top: 16px; }
  .a .acts .btn { height: 56px; font-size: 21px; }

  .composer {
    border-top: 2px solid var(--rule);
    padding: 14px 20px 20px;
    display: flex; gap: 12px; align-items: center;
    background: var(--paper);
  }
  .input {
    flex: 1; height: 60px; border: 2px solid var(--ink); background: #fff;
    display: flex; align-items: center; padding: 0 16px;
    font-size: 21px; color: #8a8172;
  }
  .mic {
    width: 60px; height: 60px; border: 2px solid var(--seal); background: var(--seal);
    color: #fbf6ec; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; border-radius: 4px;
  }

  .chip { width: 100%; border: 2px solid var(--rule); background: var(--paper-2); padding: 14px 10px; font-size: 19px; border-radius: 6px; text-align: center; }

  .label {
    position: absolute; top: -30px; left: 0;
    font-size: 15px; letter-spacing: 2px; color: #efe6d5;
  }
  .wrap { position: relative; }
  .offline {
    background: #e8d9bd; border-bottom: 2px solid var(--rule);
    font-size: 17px; padding: 8px 20px; color: var(--ink-2);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">首页 · 一屏三件事</div>
    <div class="phone">
      <div class="status"><span>07:42</span><span>综采一队 WiFi · 满格</span></div>
      <div class="head">
        <div class="name">张明</div>
        <div class="meta">综采一队 · 采煤机司机 · 安全员</div>
      </div>
      <div class="body">
        <button class="btn primary">问规程<span class="sub">点一下就能问</span></button>
        <div class="btn-row">
          <button class="btn">报隐患</button>
          <button class="btn">学规程</button>
        </div>
        <div class="todo">
          <span class="tag">今天要做</span>
          <div class="t">瓦斯防治考试</div>
          <div class="d">15:00 开始 · 20 题 · 约 10 分钟</div>
        </div>
        <div>
          <div class="sec">常问的（点一下就行）</div>
          <div class="chips">
            <div class="chip">瓦斯超限怎么办</div>
            <div class="chip">停风了怎么办</div>
            <div class="chip">透水征兆</div>
          </div>
        </div>
      </div>
      <div class="tabbar">
        <div class="tab active"><span class="ico">问</span>问规程</div>
        <div class="tab"><span class="ico">学</span>学规程</div>
        <div class="tab"><span class="ico">我</span>我的</div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="label">问答 · 答案与原文</div>
    <div class="phone">
      <div class="status"><span>07:43</span><span>综采一队 WiFi · 满格</span></div>
      <div class="ask-head">
        <span class="back">← 返回</span>
        <span class="title">问规程</span>
      </div>
      <div class="body">
        <div class="q">瓦斯浓度达到 1.5% 怎么办？</div>
        <div class="a">
          <span class="clause">第一百三十六条</span>
          <div class="text">必须停止工作，切断电源，撤出人员，进行处理。</div>
          <div class="src">依据：《煤矿安全规程》第三章 通风与瓦斯</div>
          <div class="acts">
            <button class="btn">读给我听</button>
            <button class="btn">再看原文</button>
          </div>
        </div>
        <div class="chips">
          <div class="chip">停风了怎么办</div>
          <div class="chip">透水征兆</div>
          <div class="chip">敲帮问顶</div>
        </div>
      </div>
      <div class="composer">
        <div class="input">打字，或按右边说话</div>
        <div class="mic">说</div>
      </div>
    </div>
  </div>
</body>
</html>
