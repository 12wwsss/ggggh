# 煤矿安全员 AI 智能体 · Nginx 反向代理
# 放到 /etc/nginx/sites-available/coal-ai.conf
# 用完记得：ln -s 到 sites-enabled，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # ↓↓↓ 换成你的备案域名
    server_name api.example.com;

    # 上传文件大小（知识库 PDF/Word）
    client_max_body_size 20m;

    access_log /var/log/nginx/coal-ai.access.log;
    error_log  /var/log/nginx/coal-ai.error.log;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # 接口
    location /api/ {
        proxy_pass         http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 大模型可能要几十秒，别用默认 60s
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
        proxy_buffering       off;
    }

    # 健康检查页（可删）
    location = /health {
        proxy_pass http://127.0.0.1:8789/api/health;
        proxy_set_header Host $host;
    }

    location = / {
        default_type text/plain;
        return 200 "coal-ai backend is running\n";
    }
}

